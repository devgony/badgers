name: coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write # `read` is sufficient when repository storage/Pages are disabled
  checks: write
  pull-requests: write

concurrency:
  group: badgers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install coverage pytest

      - uses: devgony/badgers@v1
        with:
          coverage-command: >-
            python -m coverage run -m pytest &&
            mkdir -p coverage &&
            python -m coverage lcov -o coverage/lcov.info
          lcov-file: coverage/lcov.info
          github-storage-repo: ${{ github.repository }}
          markdown-summary: true
